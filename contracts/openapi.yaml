  /api/v1/cotizar:
    post:
      tags:
      - cotización
      summary: Cotización de flete (fórmula provisional-v1)
      description: Oficial (PDF). Los valores son salidas de `provisional-v1`, no tarifas oficiales.
      operationId: createQuote
      requestBody:
