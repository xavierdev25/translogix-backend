                summary: S7 · Bogotá → Medellín
                value:
                  origen: Bogotá D.C.
                  destino: Medellín
                  alto_cm: 40
                  ancho_cm: 50
                  largo_cm: 60
                  peso_real_kg: 45.5
                  valor_declarado_cop: 12500000
                  requiere_cadena_frio: false
                  mercancia_peligrosa: false
