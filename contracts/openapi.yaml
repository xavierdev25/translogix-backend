        external_user_id:
          description: En claro solo en memoria del adaptador; se persiste hasheado.
          maxLength: 256
          minLength: 1
          title: External User Id
          type: string
        session_id:
          anyOf:
          - format: uuid4
            type: string
          - type: 'null'
          default: null
          title: Session Id
        message_type:
          $ref: '#/components/schemas/MessageType'
        content:
          $ref: '#/components/schemas/MessageContent'
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        delivery_mode:
          $ref: '#/components/schemas/DeliveryMode'
      required:
      - channel
      - message_id
      - external_user_id
      - message_type
      - content
      - timestamp
      - delivery_mode
      title: InboundMessage
      type: object
      x-internal: true
    MessageContent:
      additionalProperties: false
      properties:
        text:
          anyOf:
          - maxLength: 4096
            type: string
          - type: 'null'
          default: null
          title: Text
        attachments:
          items:
            $ref: '#/components/schemas/Attachment'
          title: Attachments
          type: array
        interactive_reply_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Interactive Reply Id
        asr:
          anyOf:
          - $ref: '#/components/schemas/AsrInfo'
          - type: 'null'
          default: null
        system_event:
          anyOf:
          - $ref: '#/components/schemas/SystemEventCode'
          - type: 'null'
          default: null
          description: Solo con message_type=SYSTEM_EVENT.
      title: MessageContent
      type: object
    RagAnswer:
      additionalProperties: false
      properties:
        answer_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer Text
        grounded:
          description: 'False: no se genera texto afirmativo.'
          title: Grounded
          type: boolean
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          title: Citations
          type: array
        confidence:
          $ref: '#/components/schemas/Confidence'
        retrieval:
          additionalProperties: true
          description: top_k, scores y filtros usados.
          examples:
          - filters:
              tipo: normativa_carga
            scores:
            - 0.82
            - 0.71
            top_k: 5
          title: Retrieval
          type: object
      required:
      - answer_text
      - grounded
      - citations
      - confidence
      - retrieval
      title: RagAnswer
      type: object
      x-internal: true
    SystemEventCode:
      enum:
      - SESSION_OPENED
      - CALL_STARTED
      - CALL_ENDED
      - CALL_TRANSFERRED
      title: SystemEventCode
      type: string
    WsHandoffStatusEvent:
      additionalProperties: false
      properties:
        type:
          const: handoff_status
          default: handoff_status
          title: Type
          type: string
        session_id:
          format: uuid4
          title: Session Id
          type: string
        handoff_id:
          format: uuid4
          title: Handoff Id
          type: string
        status:
          $ref: '#/components/schemas/HandoffStatus'
        prioridad:
          $ref: '#/components/schemas/Prioridad'
        cola:
          $ref: '#/components/schemas/ColaDestino'
        tiempo_espera_estimado_segundos:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Tiempo Espera Estimado Segundos
      required:
      - type
      - session_id
      - handoff_id
      - status
      - prioridad
      - cola
      - tiempo_espera_estimado_segundos
      title: WsHandoffStatusEvent
      type: object
      x-internal: true
    WsMessageEvent:
      additionalProperties: false
      properties:
        type:
          const: message
          default: message
          title: Type
          type: string
        session_id:
          format: uuid4
          title: Session Id
          type: string
        reply:
          $ref: '#/components/schemas/ConversationReply'
      required:
      - type
      - session_id
      - reply
      title: WsMessageEvent
      type: object
      x-internal: true
    WsEvent:
      oneOf:
      - $ref: '#/components/schemas/WsMessageEvent'
      - $ref: '#/components/schemas/WsHandoffStatusEvent'
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/WsMessageEvent'
          handoff_status: '#/components/schemas/WsHandoffStatusEvent'
  securitySchemes:
    ClientId:
      type: apiKey
      description: UUID estable del navegador (el mismo `client_id` de `POST /chat/messages`).
      in: header
      name: X-Client-Id
    StaffToken:
      type: http
      description: 'Token personal de un usuario interno: `Authorization: Bearer <tlxs_…>`.'
      scheme: bearer
    AdminToken:
      type: apiKey
      description: Token de administración definido en `ADMIN_TOKEN` (entorno).
      in: header
      name: X-Admin-Token
    ApiKey:
      type: http
      description: 'API key de un cliente empresarial: `Authorization: Bearer <api_key>`.'
      scheme: bearer
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Identificador de correlación; se genera si falta.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,128}$
  headers:
    XRequestId:
      description: El mismo X-Request-ID de la petición, o uno generado.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,128}$
x-websockets:
  /ws/chat/{session_id}:
    summary: Eventos de la sesión de chat (servidor → cliente)
    x-priority: P1
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    events:
      $ref: '#/components/schemas/WsEvent'
    eventTypes:
    - WsMessageEvent
    - WsHandoffStatusEvent
