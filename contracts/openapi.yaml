components:
  schemas:
    ApiScope:
      type: string
      enum:
      - shipments:create
      - shipments:read
      - batches:create
      - batches:read
      title: ApiScope
    AttachmentLink:
      properties:
        url:
          type: string
          minLength: 1
          title: Url
        expira_en_segundos:
          type: integer
          exclusiveMinimum: 0.0
          title: Expira En Segundos
      additionalProperties: false
      type: object
      required:
      - url
      - expira_en_segundos
      title: AttachmentLink
      description: '2.1.0 (CR-011): presigned download URL from S3, short-lived. Do not store it.'
    AttachmentRef:
      properties:
        attachment_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Attachment Id
        declared_doc_code:
          anyOf:
          - $ref: '#/components/schemas/DocumentoCodigo'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - attachment_id
      title: AttachmentRef
      description: Attachment already stored by the platform, referenced by id.
    AttachmentUploadResponse:
      properties:
        attachment_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Attachment Id
          description: Id aleatorio.
        kind:
          type: string
          enum:
          - IMAGE
          - DOCUMENT
          title: Kind
        mime_type:
          type: string
          enum:
          - application/pdf
          - image/jpeg
          title: Mime Type
          description: Tipo detectado por contenido.
        size_bytes:
          type: integer
          exclusiveMinimum: 0.0
          title: Size Bytes
        declared_doc_code:
          anyOf:
          - $ref: '#/components/schemas/DocumentoCodigo'
          - type: 'null'
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
      additionalProperties: false
      type: object
      required:
      - attachment_id
      - kind
      - mime_type
      - size_bytes
      - declared_doc_code
      - sha256
      title: AttachmentUploadResponse
    AuditEventItem:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        action:
          type: string
          title: Action
        http_status:
          type: integer
          title: Http Status
        request_id:
          type: string
          title: Request Id
        client_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Client Id
        staff_user_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Staff User Id
        resource_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
